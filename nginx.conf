# Configuração do nginx que serve o site estático dentro do cluster.
#
# Os headers de segurança (CSP, HSTS, Referrer-Policy, Permissions-Policy,
# X-Content-Type-Options) NÃO estão aqui de propósito: eles são aplicados na HTTPRoute do
# Envoy Gateway, via filtro ResponseHeaderModifier da Gateway API. Ter os dois lugares
# emitindo header é como se acaba com header duplicado e política contraditória — o
# Gateway é a borda, e é dele a responsabilidade.

server {
    # 8080 e não 80: o pod roda como usuário sem privilégio, e bind em porta abaixo de
    # 1024 exigiria capacidade que ele não tem motivo para receber.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não anunciar a versão do nginx no header Server nem nas páginas de erro.
    server_tokens off;

    # Diretório sem index.html não vira listagem de arquivos.
    autoindex off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;
    # woff2 já é comprimido (Brotli internamente) — recomprimir só gasta CPU.

    # Estáticos versionados por conteúdo podem ter cache longo; o HTML, não, senão uma
    # publicação demora a aparecer para quem já visitou.
    location ~* \.(woff2|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        # $uri/ é o que faz /en/ e /en/talks/ resolverem para o index.html do diretório.
        try_files $uri $uri/ $uri.html =404;
    }

    # Sem página 404 própria: o site não tem uma ainda. Quando tiver, é aqui que entra.
}
